name: incidents-daily

# Daily collection of the two automatic layers into docs/incidents/:
#   - SEC 8-K Item 1.05 disclosures                    (rare: a few per month)
#   - California and Washington AG breach registries   (~2.5 filings/day, measured 2026-08-10)
# Data updates only — code/display changes stay behind normal PR review.
#
# Only the SEC layer opens a notice issue. Item 1.05 is rare and each filing is genuinely a
# prompt to consider writing the incident up in the curated layer. Registry rows arrive every
# day, so an issue per run would be noise that trains everyone to ignore the notice — for those
# the PR diff is the record.
#
# Shaped after kev-daily.yml: main is protected, so the bot cannot push to main. It opens an
# auto-PR from a deterministic branch and merges it. Branch protection is not weakened; the PR
# diff is the audit trail and the guards are the gatekeeper.
#
# The schedule was enabled on 2026-08-08, on explicit owner go, after two workflow_dispatch
# verification runs: one with --since that exercised the auto-PR path end to end (PR opened and
# merged, positive control confirmed it landed on main, notice issue opened, success ping), and
# one with no input that confirmed the no-op path (no PR, main unchanged, success ping still
# sent).
#
# It was turned OFF again on 2026-08-11 for the length of one review, when the state AG layer
# was added, and turned back on the same day after the same two-run verification — this time
# with the registry collector in the job:
#
#   Run 1 (no input): three new California filings landed. Auto-PR #41 opened and merged, the
#   diff scope check confined it to docs/incidents/ and incidents/data/state_ag.json, the
#   protected sections were byte-identical to the pre-merge tree, positive control confirmed
#   main advanced, success ping sent.
#   Run 2 (no input): no-op. No PR, main unchanged at the same SHA, both notice steps skipped,
#   success ping still sent.
#
# No backfill was needed on re-enabling: the last scheduled run was 2026-08-10 22:26 UTC, about
# two hours before the pause, so the collector's own two-day window already covered the gap.
# That will NOT hold for a longer pause — see the `since` input if this is ever off for days.
on:
  workflow_dispatch:
    inputs:
      since:
        description: >-
          SEC layer: collect from this date (YYYY-MM-DD) instead of the default two-day
          window. Used to widen the record deliberately; a window large enough to reach
          EDGAR's 100-hit page limit halts rather than returning a truncated result.
        required: false
        type: string
      registry_since:
        description: >-
          State AG layer: collect from this date (YYYY-MM-DD) instead of the default 90 days.
          A deliberate backfill; expect to raise wa_pages with it, and note the integrity gate
          caps new rows per run unless INCIDENTS_REGISTRY_MAX_NEW_PER_RUN is raised too.
        required: false
        type: string
      wa_pages:
        description: >-
          State AG layer: how many Washington pages to read, newest first. One page spans
          about three months, so the daily default of 1 is ample. Raise only for a backfill.
        required: false
        type: string
  # This cron drives BOTH collectors. If it is ever paused again, remember that the SEC side
  # stops with it: the default window is two days, so a pause longer than that needs one run
  # with `since` set to the last scheduled date to cover the gap. The record is append-only and
  # dedupes on adsh, so an overlapping window costs nothing while a missed one is silent.
  schedule:
    # 22:00 UTC == 07:00 JST. 8-K filings land during US business hours; a JST-morning run
    # picks up the prior US day. Kept clear of kev-daily (23:30 UTC) so the two never race
    # for the same base commit. The state AG registries publish on US business days with a
    # 3-13 day lag, so the same slot suits them; they are not time-critical.
    - cron: "0 22 * * *"

# Least privilege: commit the regenerated section (contents) and open/merge its PR
# (pull-requests). No PAT — the built-in GITHUB_TOKEN only.
permissions:
  contents: write
  pull-requests: write
  issues: write            # the "new disclosure" notice is a GitHub issue (no new credential)

concurrency:
  group: incidents-daily
  cancel-in-progress: false

env:
  BOT_BRANCH: bot/incidents-daily

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
        # No pip install: the collector is standard-library only.

      - name: Collect SEC Item 1.05 and state AG registries (integrity-gated, append-only)
        id: run
        # run.py fail-halts (non-zero exit) on a degraded fetch from EITHER source, so a bad
        # upstream response fails the job here and never appends to the permanent record.
        # pipefail is essential: without it `python | tee` would mask a failure as success.
        env:
          # SEC requires a declared User-Agent with contact information (403 without one).
          # Held as a secret so no contact address is committed to this public repo. The state
          # registries need no secret: neither requires a declared UA, and the descriptive one
          # the collector sends carries this repo's URL rather than a contact address.
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          # Read through the environment, never interpolated into the script body: a
          # workflow_dispatch input is attacker-controllable text and `${{ }}` inside `run:`
          # would splice it into the shell. Validated below before it reaches a command.
          SINCE: ${{ inputs.since }}
          REGISTRY_SINCE: ${{ inputs.registry_since }}
          WA_PAGES: ${{ inputs.wa_pages }}
        run: |
          set -euo pipefail
          if [ -z "${SEC_USER_AGENT:-}" ]; then
            echo "::error::SEC_USER_AGENT secret is not set. SEC requires a declared"
            echo "::error::User-Agent with contact information; without it EDGAR returns 403."
            exit 1
          fi
          args=()
          if [ -n "${SINCE:-}" ]; then
            case "$SINCE" in
              [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;;
              *) echo "::error::since must be YYYY-MM-DD, got '$SINCE'"; exit 1 ;;
            esac
            echo "SEC: collecting from $SINCE instead of the default two-day window"
            args+=(--since "$SINCE")
          fi
          if [ -n "${REGISTRY_SINCE:-}" ]; then
            case "$REGISTRY_SINCE" in
              [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;;
              *) echo "::error::registry_since must be YYYY-MM-DD, got '$REGISTRY_SINCE'"; exit 1 ;;
            esac
            echo "state AG: collecting from $REGISTRY_SINCE instead of the default 90 days"
            args+=(--registry-since "$REGISTRY_SINCE")
          fi
          if [ -n "${WA_PAGES:-}" ]; then
            case "$WA_PAGES" in
              ''|*[!0-9]*) echo "::error::wa_pages must be a positive integer, got '$WA_PAGES'"; exit 1 ;;
            esac
            echo "state AG: reading $WA_PAGES Washington page(s)"
            args+=(--wa-pages "$WA_PAGES")
          fi
          python -m incidents.run "${args[@]}" | tee "$RUNNER_TEMP/run.log"
          stats=$(grep -m1 'integrity stats' "$RUNNER_TEMP/run.log" | sed 's/^\[incidents\] //' || true)
          echo "stats=$stats" >> "$GITHUB_OUTPUT"
          rstats=$(grep -m1 'registry integrity stats' "$RUNNER_TEMP/run.log" | sed 's/^\[incidents\] //' || true)
          echo "rstats=$rstats" >> "$GITHUB_OUTPUT"
          # Only SEC lines feed the notice issue. `NEW ` with the trailing space deliberately
          # does not match `NEW-REG`: registry rows arrive daily and are not work items.
          {
            echo "new<<__EOF__"
            grep '^\[incidents\] NEW ' "$RUNNER_TEMP/run.log" | sed 's/^\[incidents\] NEW  //' || true
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"
          echo "reg_new_count=$(grep -c '^\[incidents\] NEW-REG ' "$RUNNER_TEMP/run.log" || true)" \
            >> "$GITHUB_OUTPUT"
          # Filer names newly queued for a human decision. Emitted even when docs/incidents/ is
          # unchanged: a withheld filing produces no page diff, so gating this on the no-op
          # check would silently swallow the very case that needs a person.
          {
            echo "pending_filers<<__EOF__"
            grep '^\[incidents\] PENDING-FILER ' "$RUNNER_TEMP/run.log" \
              | sed 's/^\[incidents\] PENDING-FILER  //' || true
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Enforce diff scope (only docs/incidents/ and incidents/data/)
        # Contain the "no direct commits to main" exception: the automated change may only touch
        # these paths. Any change outside them fails the job before a PR is opened.
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            path=${line:3}
            case "$path" in
              docs/incidents/*|incidents/data/*) ;;
              *) echo "::error::out-of-scope change not allowed for auto-update: $path"; bad=1 ;;
            esac
          done < <(git status --porcelain)
          if [ "$bad" -ne 0 ]; then exit 1; fi

      - name: Verify the published sections nobody may touch are untouched
        # docs/archive/ is the frozen month archive, docs/kev/ is a separately published
        # section, and docs/report_*.html / docs/index.html come from the private Method-D
        # build. This job must never alter any of them.
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain docs/archive docs/kev docs/index.html docs/report_en.html docs/report_ja.html)" ]; then
            echo "::error::this job modified a section it must not touch:"
            git status --porcelain docs/archive docs/kev docs/index.html docs/report_*.html
            exit 1
          fi

      - name: Detect no-op (skip PR if docs/incidents/ is unchanged)
        id: noop
        # The published output is docs/incidents/. If it did not change, open no PR — this
        # avoids a daily empty commit and a needless Pages rebuild. Item 1.05 filings are rare,
        # so the no-op path is the ordinary daily outcome.
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain docs/incidents incidents/data)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "docs/incidents changed — will open a PR"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no change — no-op, nothing to publish (the ordinary daily outcome)"
          fi

      - name: Open and merge auto-PR
        id: autopr
        if: steps.noop.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          STATS: ${{ steps.run.outputs.stats }}
          RSTATS: ${{ steps.run.outputs.rstats }}
          REG_NEW: ${{ steps.run.outputs.reg_new_count }}
        run: |
          set -euo pipefail

          # Never stack PRs: an already-open bot PR means a prior run failed mid-flight. Fail
          # loudly and let a human resolve it rather than opening a parallel one.
          open_count=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BOT_BRANCH" \
                         --state open --json number --jq 'length')
          if [ "$open_count" != "0" ]; then
            echo "::error::an open PR from $BOT_BRANCH already exists — a previous run likely"
            echo "::error::failed after opening it. Resolve/close it before re-running."
            exit 1
          fi

          base=$(git rev-parse HEAD)
          echo "base=$base" >> "$GITHUB_OUTPUT"

          git config user.name "incidents-daily-bot"
          git config user.email "incidents-daily-bot@users.noreply.github.com"

          git push origin --delete "$BOT_BRANCH" 2>/dev/null || true
          git checkout -B "$BOT_BRANCH"
          git add docs/incidents incidents/data
          git commit -m "incidents: daily disclosure update (docs/incidents + record)"
          commit=$(git rev-parse HEAD)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

          git push origin "$BOT_BRANCH"

          body=$(cat <<EOF
          Automated daily disclosure update (auto-PR + auto-merge).

          - SEC integrity gate passed: ${STATS:-(stats unavailable)}
          - State AG integrity gate passed: ${RSTATS:-(stats unavailable)}
          - New state AG filings this run: ${REG_NEW:-0}
          - Diff scope enforced: changes confined to docs/incidents/ and incidents/data/
          - docs/archive/, docs/kev/, docs/index.html and docs/report_*.html verified untouched
          - Both records are append-only; existing rows are never rewritten
          - Collector/guard logic unchanged; data only.

          Opened and merged by .github/workflows/incidents-daily.yml.
          EOF
          )
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BOT_BRANCH" \
            --title "incidents: daily disclosure update" --body "$body"

          merged=0
          for i in 1 2 3 4 5; do
            if gh pr merge --repo "$GITHUB_REPOSITORY" "$BOT_BRANCH" --merge --delete-branch; then
              merged=1; break
            fi
            echo "merge not ready (attempt $i) — retrying"
            sleep 6
          done
          if [ "$merged" -ne 1 ]; then
            echo "::error::auto-merge failed after retries"
            exit 1
          fi

      - name: Positive control — confirm the update actually landed on main
        if: steps.noop.outputs.changed == 'true'
        # Trust state, not exit codes. Verify the data commit is really an ancestor of
        # origin/main and that main advanced. If not, fail so NO success ping is sent.
        env:
          COMMIT: ${{ steps.autopr.outputs.commit }}
          BASE: ${{ steps.autopr.outputs.base }}
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          head=$(git rev-parse origin/main)
          if [ "$head" = "$BASE" ]; then
            echo "::error::origin/main did not advance ($head) — update did not land"; exit 1
          fi
          if ! git merge-base --is-ancestor "$COMMIT" origin/main; then
            echo "::error::merge reported success but $COMMIT is NOT on origin/main"; exit 1
          fi
          echo "positive control OK: $COMMIT is on origin/main (now ${head})"

      - name: Notice — open an issue listing the new disclosures
        # The notification IS the work item: a new Item 1.05 filing is exactly the prompt to
        # consider whether to write it up in the curated layer. An issue keeps this inside
        # GitHub, so no new credential (Pushover token) has to be stored here.
        if: steps.noop.outputs.changed == 'true' && steps.run.outputs.new != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NEW: ${{ steps.run.outputs.new }}
        run: |
          set -euo pipefail
          [ -z "${NEW//[[:space:]]/}" ] && exit 0
          body=$(cat <<EOF
          New SEC Form 8-K **Item 1.05** disclosure(s) recorded in \`docs/incidents/\`.

          \`\`\`
          ${NEW}
          \`\`\`

          These are now on the automatic layer. Nothing further is required — this notice
          exists so the curated layer can be considered while the filing is current.

          Opened by .github/workflows/incidents-daily.yml.
          EOF
          )
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "incidents: new Item 1.05 disclosure(s)" --body "$body" || \
            echo "::warning::could not open the notice issue (the data update itself succeeded)"

      - name: Notice — ask about registry filer names that may be individuals
        # A blocking decision, not an FYI: these filings are withheld from the page AND from
        # incidents/data/state_ag.json until answered, so an unanswered issue means data is
        # sitting out. Fires only for names newly queued this run — a name already waiting does
        # not re-open a notice every day.
        #
        # The name appears here and in the run log because a person cannot decide otherwise.
        # An issue is a decision prompt that gets closed; what it must never become is the
        # published page or the permanent record, and it is neither.
        if: steps.run.outputs.pending_filers != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PENDING: ${{ steps.run.outputs.pending_filers }}
        run: |
          set -euo pipefail
          [ -z "${PENDING//[[:space:]]/}" ] && exit 0
          body=$(cat <<EOF
          These filer names from the state AG registries are shaped like a natural person, so
          their filings are **withheld** — from \`docs/incidents/\` and from
          \`incidents/data/state_ag.json\` alike — until someone decides.

          \`\`\`
          ${PENDING}
          \`\`\`

          Nothing has been concluded about anyone: \`incidents/filers.py\` matched the SHAPE of
          the name. Most flagged names turn out to be companies.

          To decide, edit \`incidents/data/filer_decisions.json\`:

          - **an organisation** → add the name to \`organisations\`, exactly as the state
            publishes it. Its filings appear on the next run and permanently after.
          - **an individual** → add \`sha256(name)\` to \`individual_hashes\`. Do **not** write
            the name into that file: recording the decision must not create the per-person
            record the decision exists to prevent.

          \`\`\`
          python3 -c "from incidents.filers import name_hash; print(name_hash('NAME'))"
          \`\`\`

          Opened by .github/workflows/incidents-daily.yml.
          EOF
          )
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "incidents: filer name(s) awaiting an organisation/individual decision" \
            --body "$body" || \
            echo "::warning::could not open the notice issue (the data update itself succeeded)"

      - name: Dead-man's switch — ping on CONFIRMED success only
        if: success()
        # Reached only if every prior step succeeded: guard passed AND (no-op OR
        # PR-merged-and-verified-on-main). no-op is a legitimate success and does ping.
        env:
          HC: ${{ secrets.INCIDENTS_HEALTHCHECK_URL }}
        run: |
          if [ -n "$HC" ]; then curl -fsS -m 10 --retry 3 "$HC" || true; fi

      - name: Dead-man's switch — signal failure
        if: failure()
        env:
          HC: ${{ secrets.INCIDENTS_HEALTHCHECK_URL }}
        run: |
          if [ -n "$HC" ]; then curl -fsS -m 10 --retry 3 "${HC%/}/fail" || true; fi
